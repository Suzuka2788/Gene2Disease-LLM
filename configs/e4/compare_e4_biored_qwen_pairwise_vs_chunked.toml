# E4 comparison, secondary.
[run]
stage = "compare"
output = "results/compare_e4_biored_qwen_pairwise_vs_chunked.json"
runs_dir = "runs"
freeze_manifest = "configs/e4/frozen_manifest.json"

[data]
dataset = "biored"
folder = "../../archive_v1/experiments/biored/data/BioRED"
splits = ["Test"]

[stats]
n_resamples = 10000
seed = 20261107
level = 0.95

[compare]
first = "e4_biored_qwen_pairwise"
second = "e4_biored_qwen_chunked"
view = "main"
delta = 0.05
report_precision = true
load_bands = [1, 4, 15, 40]
