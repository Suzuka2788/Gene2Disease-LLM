# E4 comparison, primary family (Bonferroni, 6 contrasts).
[run]
stage = "compare"
output = "results/compare_e4_biotriplex_gemma_pairwise_vs_joint.json"
runs_dir = "runs"
freeze_manifest = "configs/e4/frozen_manifest.json"

[data]
dataset = "biotriplex"
release = "../../archive_v1/experiments/biotriplex/data/splits.json"
splits = ["val", "test"]

[stats]
n_resamples = 10000
seed = 20261107
level = 0.9916666666666667

[compare]
first = "e4_biotriplex_gemma_pairwise"
second = "e4_biotriplex_gemma_joint"
view = "main"
delta = 0.05
report_precision = false
load_bands = [1, 4, 15, 40]
