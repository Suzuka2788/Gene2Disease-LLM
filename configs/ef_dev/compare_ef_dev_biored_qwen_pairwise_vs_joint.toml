# Not run yet. EF on development data (plan section 11), comparing runs made with the
# settings frozen on 2026-11-07 (D14-D16, budget 1000 + 150 x pairs).
# Start the server first: scripts/serve_local.ps1 -Model qwen3.5-9b
[run]
stage = "compare"
output = "results/compare_ef_dev_biored_qwen_pairwise_vs_joint.json"
runs_dir = "runs"

[data]
dataset = "biored"
folder = "../../archive_v1/experiments/biored/data/BioRED"
splits = ["Dev"]

[stats]
n_resamples = 10000
seed = 20261107
level = 0.95

[compare]
first = "ef_dev_biored_qwen_pairwise"
second = "ef_dev_biored_qwen_joint"
view = "main"
delta = 0.05
# BioRED precision and F1 are reported but not interpreted until annotation
# exhaustiveness is confirmed (plan section 5).
report_precision = true
load_bands = [1, 4, 15, 40]
