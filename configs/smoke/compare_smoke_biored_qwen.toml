# Smoke test of judge -> compare against the real server: 3 BioRED Dev papers.
[run]
stage = "compare"
output = "results/compare_smoke_biored_qwen_pairwise_vs_joint.json"
runs_dir = "runs"

[data]
dataset = "biored"
folder = "../../archive_v1/experiments/biored/data/BioRED"
splits = ["Dev"]

[stats]
n_resamples = 1000
seed = 20261107
level = 0.95

[compare]
first = "smoke_biored_qwen_pairwise"
second = "smoke_biored_qwen_joint"
view = "main"
delta = 0.05
report_precision = false
max_papers = 3
load_bands = [1, 4, 15, 40]
